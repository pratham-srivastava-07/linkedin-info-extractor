services:
  postgres:
    image: postgres:16-alpine
    container_name: linkedin-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: profilelens
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Dependents can `depends_on: { postgres: { condition: service_healthy } }`
      # instead of racing the first connection.
      test: ["CMD-SHELL", "pg_isready -U user -d profilelens"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
